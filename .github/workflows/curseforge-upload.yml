name: Upload ForeverPath to CurseForge

on:
  push:
    tags:
      - 'v*'

# A tag represents one CurseForge file. Do not upload the same tag concurrently.
concurrency:
  group: curseforge-upload-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    # A manual re-run of a completed/partially completed upload must not create
    # a second CurseForge file for the same tag.
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the release archive
        shell: bash
        run: test -s ForeverPath.zip

      - name: Upload to CurseForge
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          metadata="$(jq -n \
            --arg displayName "ForeverPath $RELEASE_TAG" \
            --arg changelog "Release $RELEASE_TAG. See CHANGELOG.md in the repository for details." \
            '{changelog: $changelog, changelogType: "markdown", displayName: $displayName, releaseType: "release"}')"
          curl --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$metadata" \
            -F "file=@ForeverPath.zip;type=application/zip" \
            "https://wow.curseforge.com/api/projects/1778870/upload-file"
