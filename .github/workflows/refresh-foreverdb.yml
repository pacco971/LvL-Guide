name: Refresh ForeverPath from ForeverDB

on:
  push:
    branches:
      - main
    paths:
      - '.github/refresh-foreverdb.trigger'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      extended:
        description: 'Load optional item/spell/vendor and dungeon detail endpoints (slow)'
        required: false
        default: false
        type: boolean

# Serialize scheduled and manual checks so the same data build is never
# processed twice at the same time.
concurrency:
  group: foreverdb-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # A manual re-run must not risk uploading the same CurseForge file twice.
    # The next scheduled run will retry a failed refresh.
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required secrets
        shell: bash
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$FOREVERDB_API_KEY" || {
            echo "::error::Missing repository secret FOREVERDB_API_KEY"
            exit 1
          }
          test -n "$CF_API_TOKEN" || {
            echo "::error::Missing repository secret CF_API_TOKEN"
            exit 1
          }

      - name: Refresh the local ForeverDB snapshot
        id: refresh
        shell: bash
        env:
          FOREVERDB_API_KEY: ${{ secrets.FOREVERDB_API_KEY }}
          EXTENDED_IMPORT: ${{ inputs.extended || false }}
        run: |
          args=()
          if [[ "$EXTENDED_IMPORT" == "true" ]]; then
            args+=(--extended)
            echo "Running the optional extended ForeverDB import."
          else
            echo "Running the fast core ForeverDB import. Use the manual 'extended' input for optional large endpoints."
          fi
          python tools/refresh_foreverdb.py "${args[@]}"

      - name: Upload the changed archive to CurseForge
        if: steps.refresh.outputs.data_changed == 'true'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ARCHIVE_NAME: ${{ steps.refresh.outputs.archive_name }}
          DATA_BUILD: ${{ steps.refresh.outputs.data_build }}
        run: |
          metadata="$(jq -n \
            --arg displayName "ForeverPath ForeverDB $DATA_BUILD" \
            --arg changelog "Automated data refresh for ForeverDB build $DATA_BUILD. Includes verified quests, rewards, items, spells and route support. See CHANGELOG.md for code changes." \
            '{changelog: $changelog, changelogType: "markdown", displayName: $displayName, releaseType: "release"}')"
          curl --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$metadata" \
            -F "file=@$ARCHIVE_NAME;type=application/zip" \
            "https://wow.curseforge.com/api/projects/1778870/upload-file"

      - name: Commit the refreshed archive
        if: steps.refresh.outputs.data_changed == 'true'
        shell: bash
        run: |
          # The data request can take several minutes. During that time a
          # normal code/tag commit may land on main. Preserve the freshly
          # generated archive, reset to the newest main, then commit only the
          # archive. This avoids binary-zip rebase conflicts and stale pushes.
          refreshed_archive="$RUNNER_TEMP/ForeverPath-refreshed.zip"
          cp ForeverPath.zip "$refreshed_archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$refreshed_archive" ForeverPath.zip
            git add ForeverPath.zip
            git commit -m "Refresh ForeverPath data for ForeverDB ${{ steps.refresh.outputs.data_build }}" || true
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during refresh commit; retrying ($attempt/3)"
            sleep 2
          done
          echo "Could not push refreshed ForeverDB archive after three attempts."
          exit 1
